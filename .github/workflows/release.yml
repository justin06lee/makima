name: release

on:
  push:
    tags: ['v*']
  # A dry run. Everything a release would publish is built — the archives, the
  # app on each platform it ships for, the checksums over all of it — and left
  # on the run as artifacts, and nothing is published. For changing this file
  # without cutting a release to find out whether it works.
  workflow_dispatch:

permissions:
  contents: write
  # The relay's container image goes to ghcr.io, which the default token
  # cannot write to without this.
  packages: write

jobs:
  # The desktop app, which dist/install.sh puts in place beside the binaries.
  #
  # Built on the platform it is for, unlike the binaries: Tauri links against
  # the system's web view, so there is no cross-building it. Linux is built on
  # Ubuntu 22.04 because a package made against an older system installs on
  # newer ones and not the other way round — and 22.04 is what a Jetson runs.
  # There is no Intel Mac build; an Intel Mac gets the binaries, and the
  # installer says why there is no app.
  app:
    strategy:
      matrix:
        include:
          - { runner: macos-latest, platform: darwin-arm64 }
          - { runner: ubuntu-22.04, platform: linux-amd64 }
          - { runner: ubuntu-22.04-arm, platform: linux-arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The version is stamped from `git describe`, as below.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: oven-sh/setup-bun@v2

      - name: the web view and tray libraries, to build against
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libwebkit2gtk-4.1-dev build-essential file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      # Exactly what `make` builds on a machine of this kind. The device faces
      # are pages of Chainsaw Man (desktop/src/characters.ts): fine in an app
      # somebody builds for themselves, not in a public download.
      - name: build
        env:
          MAKIMA_NO_AVATARS: '1'
        run: make app-build

      # Named the way dist/install.sh looks for them. The Mac's is the .app in
      # a tarball, without the AppleDouble files and extended attributes a
      # Mac's tar would otherwise add.
      - name: name it for the release
        run: |
          version=$(git describe --tags --match 'v*' --always)
          out=dist/app/makima-desktop-$version-${{ matrix.platform }}
          bundle=desktop/src-tauri/target/release/bundle
          mkdir -p dist/app
          if [ "$RUNNER_OS" = macOS ]; then
            COPYFILE_DISABLE=1 tar --no-mac-metadata -czf "$out.tar.gz" -C "$bundle/macos" makima.app
          else
            cp "$bundle"/deb/*.deb "$out.deb"
          fi
          ls -l dist/app

      # Installed the way the installer installs it, on the system it was
      # built for, so that a package whose dependencies cannot be had is found
      # here rather than on somebody's machine.
      - name: install the package
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y -q ./dist/app/*.deb
          dpkg -s makima | grep -E '^(Status|Version)'
          /usr/bin/makima version

      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.platform }}
          path: dist/app/*
          if-no-files-found: error

  release:
    # A release with an app missing for one platform would have the installer
    # quietly hand that platform the binaries alone, so all of it or none.
    needs: app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, because the version is stamped from `git describe`
          # and a shallow clone has no tags to describe against.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true

      # A release that fails its own tests is worse than no release.
      - name: test
        run: go test ./...

      - name: build release archives
        run: make release

      - uses: actions/download-artifact@v4
        with:
          pattern: app-*
          merge-multiple: true
          path: dist/release

      # make release summed the archives alone. One file covers everything the
      # installer downloads, the app included.
      - name: checksums, with the app in them
        run: |
          cd dist/release
          sha256sum -- *.tar.gz *.zip *.deb > SHA256SUMS
          cat SHA256SUMS

      - name: keep what a release would have published
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: dist/release/*

      - name: publish
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/release/*

      # The relay is the piece that genuinely wants to live in a container:
      # an ordinary network service with no interest in the host's network
      # stack, and something you want running somewhere permanently.
      - name: publish the container image
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build \
            -f dist/packaging/Dockerfile \
            --build-arg "VERSION=${GITHUB_REF_NAME}" \
            -t "$image:${GITHUB_REF_NAME}" \
            -t "$image:latest" .
          docker push "$image:${GITHUB_REF_NAME}"
          docker push "$image:latest"

      # The PKGBUILD builds from the tag's own source archive, so its checksum
      # can only be known once the tag exists. Filled in here rather than left
      # as SKIP, which would mean the package builds whatever that URL serves.
      - name: checksum the PKGBUILD source
        if: github.event_name == 'push'
        run: |
          url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"
          sum=$(curl -fsSL "$url" | sha256sum | cut -d' ' -f1)
          [ -n "$sum" ] || { echo "could not checksum the source archive"; exit 1; }
          sed -i "s|^pkgver=.*|pkgver=${GITHUB_REF_NAME#v}|" dist/packaging/PKGBUILD
          sed -i "s|^sha256sums=.*|sha256sums=('${sum}')|" dist/packaging/PKGBUILD
          gh release upload "${GITHUB_REF_NAME}" dist/packaging/PKGBUILD --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      # The formula is versioned with the code it installs, so the checksums
      # are filled in from the archives that were just built rather than by
      # hand afterwards — which is the step everybody forgets.
      #
      # Skipped, with a note, when TAP_TOKEN is not set: a release that fails
      # because a secret is missing is worse than a release without a tap, and
      # the note is what keeps "skipped" from meaning "silently never ran".
      - name: update the homebrew formula
        env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
        if: github.event_name == 'push' && env.GH_TOKEN != ''
        run: |
          version="${GITHUB_REF_NAME#v}"
          formula=dist/packaging/makima.rb

          sed -i "s|^  version \".*\"|  version \"${version}\"|" "$formula"

          for target in darwin-arm64 darwin-amd64 linux-arm64 linux-amd64; do
            sum=$(grep " makima-${GITHUB_REF_NAME}-${target}.tar.gz\$" \
                   dist/release/SHA256SUMS | cut -d' ' -f1)
            [ -n "$sum" ] || { echo "no checksum for $target"; exit 1; }

            # Replace the placeholder following this target's url line.
            awk -v t="$target" -v s="$sum" '
              index($0, t ".tar.gz") { print; getline; sub(/"[0-9a-f]{64}"/, "\"" s "\""); print; next }
              { print }
            ' "$formula" > "$formula.new" && mv "$formula.new" "$formula"
          done

          # The tap may not exist yet. Creating it here means the first
          # release makes it rather than failing on it.
          gh repo view justin06lee/homebrew-makima >/dev/null 2>&1 ||
            gh repo create justin06lee/homebrew-makima --public \
              --description "Homebrew tap for makima"
          gh repo clone justin06lee/homebrew-makima tap
          mkdir -p tap/Formula
          cp "$formula" tap/Formula/makima.rb
          cd tap
          git config user.name "makima release"
          git config user.email "noreply@github.com"
          git add Formula/makima.rb
          git commit -m "makima ${GITHUB_REF_NAME}"
          # A fresh tap has no commits and so no branch to push to.
          git push -u origin HEAD:master

      # The secrets context is not readable from a step-level `if`, so the
      # token is put in env first and the condition reads that.
      - name: say when the tap was not updated
        env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
        if: github.event_name == 'push' && env.GH_TOKEN == ''
        run: |
          echo "::warning::TAP_TOKEN is not set, so the homebrew formula was not published."
          echo "::warning::'brew install justin06lee/makima/makima' will not work for this release."
