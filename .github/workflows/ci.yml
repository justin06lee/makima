name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true

      - name: fmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./...

      # The tunnel, the relay and the pairing exchange all involve several
      # goroutines and a shared socket, so the race detector is the only thing
      # that can honestly say they are correct.
      - name: race
        run: go test -race ./...

  cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true

      # The promise is one binary per platform with nothing to install
      # alongside it. This is what keeps that true.
      - name: cross-compile
        run: make cross
