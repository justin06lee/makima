<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="makima">
  <!-- The banner's picture, squared: nodes leashed to the control plane in
       gold, the traffic between them in crimson. The centre decides who may
       speak to whom; it never carries a packet. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="48%" r="76%">
      <stop offset="0%" stop-color="#14151d"/>
      <stop offset="100%" stop-color="#0a0b10"/>
    </radialGradient>
    <radialGradient id="iris" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1016"/>
      <stop offset="100%" stop-color="#0d0a0e"/>
    </radialGradient>
  </defs>

  <!-- Rounded, so the corners are genuinely transparent. That is how an app
       icon should look on every platform, and it is also what keeps the PNG a
       true RGBA image — encoders drop the alpha channel from anything fully
       opaque, and Tauri's icon pipeline refuses those. -->
  <rect width="512" height="512" rx="104" fill="url(#bg)"/>

  <!-- Direct peer paths: crimson, solid, and never through the middle. -->
  <g stroke="#c4353f" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.92">
    <path d="M256 104 L396 330"/>
    <path d="M396 330 L116 330"/>
    <path d="M116 330 L256 104"/>
  </g>

  <!-- The leashes: gold, dashed, every node tied to the centre. -->
  <g stroke="#e0a94a" stroke-width="5" stroke-dasharray="14 11" fill="none" opacity="0.85" stroke-linecap="round">
    <path d="M256 256 L256 104"/>
    <path d="M256 256 L396 330"/>
    <path d="M256 256 L116 330"/>
  </g>

  <!-- The rings, breathing in the banner and still here. -->
  <g fill="none" stroke="#e0a94a">
    <circle cx="256" cy="256" r="72" stroke-width="3" opacity="0.34"/>
    <circle cx="256" cy="256" r="54" stroke-width="3" opacity="0.52"/>
  </g>

  <!-- The control plane. -->
  <circle cx="256" cy="256" r="38" fill="url(#iris)" stroke="#e0a94a" stroke-width="6"/>
  <circle cx="256" cy="256" r="13" fill="#c4353f"/>

  <!-- The nodes. -->
  <g fill="#0a0b10" stroke="#e8e6e3" stroke-width="6">
    <circle cx="256" cy="104" r="26"/>
    <circle cx="396" cy="330" r="26"/>
    <circle cx="116" cy="330" r="26"/>
  </g>
</svg>
